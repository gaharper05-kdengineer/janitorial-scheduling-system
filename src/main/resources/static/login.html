<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanTrack · COSM Atlanta | Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell login-shell">
    <div class="login-card">
      <div class="brand"><span class="brand-mark">C</span><span>CleanTrack</span><span class="location-badge">Location: COSM Atlanta</span></div>
      <p class="eyebrow">Operations desk</p>
      <h1 id="login-heading">Manager sign in</h1>
      <p id="login-message" hidden></p>
      <form method="post" action="/login" class="login-form">
        <input type="hidden" name="_csrf" id="csrf-input">
        <label>Username<input name="username" required autofocus></label>
        <label>Password<input name="password" type="password" required></label>
        <button type="submit" class="button button-primary">Sign in</button>
      </form>
      <p class="switch-role" id="switch-role-manager">Employee? <a href="/employee-login.html">Sign in here</a> &middot; Admin? <a href="/login.html?admin=1">Sign in here</a></p>
      <p class="switch-role" id="switch-role-admin" hidden>Not an admin? <a href="/login.html">Manager sign in</a></p>
    </div>
  </main>
  <script>
    (function () {
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        var badge = document.querySelector('.location-badge');
        badge.textContent = 'DEMO MODE';
        badge.style.background = '#f7d35c';
        badge.style.color = '#7a5c05';
        document.title = document.title.replace('COSM Atlanta', 'DEMO MODE');
      }
      var match = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
      document.getElementById('csrf-input').value = match ? decodeURIComponent(match[1]) : '';
      var params = new URLSearchParams(window.location.search);
      if (params.has('admin')) {
        document.getElementById('login-heading').textContent = 'Admin sign in';
        document.getElementById('switch-role-manager').hidden = true;
        document.getElementById('switch-role-admin').hidden = false;
      }
      var message = document.getElementById('login-message');
      if (params.has('error')) { message.textContent = 'Invalid username or password.'; message.hidden = false; }
      else if (params.has('logout')) { message.textContent = 'You have been logged out.'; message.hidden = false; }
      else if (params.has('credentialsUpdated')) { message.textContent = 'Your login was updated. Sign in with your new username and password.'; message.hidden = false; }
    })();
  </script>
</body>
</html>
