<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanTrack | Employee sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell login-shell">
    <div class="login-card">
      <div class="brand"><span class="brand-mark">C</span><span>CleanTrack</span></div>
      <p class="eyebrow">Operations desk</p>
      <h1>Employee sign in</h1>
      <p id="login-message" hidden></p>
      <form method="post" action="/login" class="login-form">
        <input type="hidden" name="_csrf" id="csrf-input">
        <input type="hidden" name="password" id="password-input">
        <label>Employee ID<input name="username" required autofocus pattern="\d{5}" maxlength="5" inputmode="numeric" autocomplete="off" placeholder="e.g. 10234"></label>
        <button type="submit" class="button button-primary">Sign in</button>
      </form>
      <p class="switch-role">Manager? <a href="/login.html">Sign in here</a></p>
    </div>
  </main>
  <script>
    (function () {
      var match = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
      document.getElementById('csrf-input').value = match ? decodeURIComponent(match[1]) : '';
      var params = new URLSearchParams(window.location.search);
      var message = document.getElementById('login-message');
      if (params.has('error')) { message.textContent = 'Invalid employee ID.'; message.hidden = false; }
      else if (params.has('logout')) { message.textContent = 'You have been logged out.'; message.hidden = false; }
      document.querySelector('.login-form').addEventListener('submit', function () {
        document.getElementById('password-input').value = document.querySelector('[name="username"]').value;
      });
    })();
  </script>
</body>
</html>
