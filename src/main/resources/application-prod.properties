# Active only when SPRING_PROFILES_ACTIVE=prod (set on the Render web
# service). DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD come from
# Render's Postgres connection details, set as env vars there.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# validate (not update/create) so Hibernate never silently alters the
# schema in production -- all schema changes go through a Flyway migration
# under db/migration instead.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

spring.flyway.enabled=true
# The live database predates Flyway and already matches V1's schema, so
# treat V1 as a no-op baseline instead of trying to re-run CREATE TABLE
# against tables that already exist -- real migrations start applying from
# V2. See the comment at the top of V1__init.sql.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
